user www-data;
worker_processes auto;
pid /run/nginx.pid;
#include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}


http{
    server {
        listen 80;
        listen [::]:80;

        listen 443 ssl;
        listen [::]:443 ssl;

        server_name rd-django-drf.com.ar www.rd-django-drf.com.ar;
        index index.php index.html index.htm;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/certs/nginx-selfsigned.key;

        ssl_protocols       TLSv1.2;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        ssl_ciphers  AES256-SHA;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 2G;

        # django server
        location / {
            proxy_pass http://rd_django:8080/;
        }
        location ^~ /static {
            proxy_pass http://rd_django:8080/static;
        }
        location ^~ /healthz {
            proxy_pass http://rd_django:8080/healthz;
        }
        location ^~ /vendor {
            proxy_pass http://rd_django:8080/vendor;
        }
        location /dashboard/stream {
            proxy_pass http://rd_django:8080/stream;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}


